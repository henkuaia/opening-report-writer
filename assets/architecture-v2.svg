  <!-- Top Title Banner -->
  <text x="32" y="38" font-size="17.5" font-weight="700" fill="#0F172A">opening-report-writer v2.0 · 四阶段渐进式披露（Progressive Disclosure）与审查规范化架构</text>
  <text x="32" y="59" font-size="12.5" fill="#475569">按任务所处阶段动态加载对应参考指南，物理隔离“宏观立论生成”与“微观审查校对”，消除上下文注意力稀释与跨章术语漂移</text>

