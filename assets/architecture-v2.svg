    <rect x="884" y="86" width="310" height="58" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="896" y="108" font-size="13" font-weight="700" fill="#0F172A">③ 全局权限与事实硬边界</text>
    <text x="896" y="128" font-size="11" fill="#475569">学校正式模板优先 · 只读诊断不改文件 · 严禁捏造题录与数据</text>
  </g>

